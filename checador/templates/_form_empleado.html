<fieldset>
  <legend>Datos de trabajo</legend>
  <div class="campos">
    <div><label for="numero">Número en el reloj *</label><input id="numero" name="numero" value="{{ e.numero or '' }}" required inputmode="numeric"></div>
    <div><label for="departamento_id">Departamento</label>
      <select id="departamento_id" name="departamento_id"><option value="">Sin departamento</option>
        {% for d in deps %}<option value="{{ d.id }}" {{ 'selected' if e.departamento_id == d.id }}>{{ d.nombre }}</option>{% endfor %}</select></div>
    <div><label for="nombre">Nombre(s) *</label><input id="nombre" name="nombre" value="{{ e.nombre or '' }}" required></div>
    <div><label for="apellidos">Apellidos</label><input id="apellidos" name="apellidos" value="{{ e.apellidos or '' }}"></div>
    <div><label for="puesto">Puesto</label><input id="puesto" name="puesto" value="{{ e.puesto or '' }}"></div>
    <div><label for="horario_id">Horario</label>
      <select id="horario_id" name="horario_id"><option value="">El de su departamento</option>
        {% for h in hors %}<option value="{{ h.id }}" {{ 'selected' if e.horario_id == h.id }}>{{ h.nombre }}</option>{% endfor %}</select></div>
    <div><label for="fecha_ingreso">Fecha de ingreso</label><input type="date" id="fecha_ingreso" name="fecha_ingreso" value="{{ e.fecha_ingreso or '' }}"></div>
    <div><label for="salario">Salario</label><input id="salario" name="salario" value="{{ e.salario or '' }}" placeholder="Ej. 2,500 semanal"></div>
  </div>
</fieldset>
<fieldset>
  <legend>Datos personales</legend>
  <div class="campos">
    <div><label for="telefono">Teléfono</label><input id="telefono" name="telefono" value="{{ e.telefono or '' }}" inputmode="tel"></div>
    <div><label for="email">Correo</label><input type="email" id="email" name="email" value="{{ e.email or '' }}"></div>
    <div><label for="fecha_nacimiento">Fecha de nacimiento</label><input type="date" id="fecha_nacimiento" name="fecha_nacimiento" value="{{ e.fecha_nacimiento or '' }}"></div>
    <div><label for="curp">CURP</label><input id="curp" name="curp" value="{{ e.curp or '' }}" maxlength="18"></div>
    <div><label for="rfc">RFC</label><input id="rfc" name="rfc" value="{{ e.rfc or '' }}" maxlength="13"></div>
    <div><label for="nss">NSS (IMSS)</label><input id="nss" name="nss" value="{{ e.nss or '' }}" maxlength="11"></div>
    <div class="campo-ancho"><label for="direccion">Dirección</label><input id="direccion" name="direccion" value="{{ e.direccion or '' }}"></div>
  </div>
</fieldset>
<fieldset>
  <legend>En caso de emergencia</legend>
  <div class="campos">
    <div><label for="contacto_emergencia">Avisar a</label><input id="contacto_emergencia" name="contacto_emergencia" value="{{ e.contacto_emergencia or '' }}"></div>
    <div><label for="tel_emergencia">Teléfono</label><input id="tel_emergencia" name="tel_emergencia" value="{{ e.tel_emergencia or '' }}" inputmode="tel"></div>
    <div class="campo-ancho"><label for="notas">Notas</label><textarea id="notas" name="notas">{{ e.notas or '' }}</textarea></div>
  </div>
</fieldset>
